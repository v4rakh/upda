          in: query
          description: the search term
          required: false
          schema:
            type: string
        - name: searchIn
          in: query
          description: the search in
          required: false
          schema:
            type: string
            default: application
            enum:
              - application
              - provider
              - host
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePageResponse'
        '400':
          description: Bad request
