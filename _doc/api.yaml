components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    # response
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          enum:
            - IllegalArgument
            - Unauthorized
            - Forbidden
            - NotFound
            - Conflict
            - GeneralError
    InfoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            timeZone:
              type: string
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            healthy:
              type: boolean
    UpdateResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
        createdAt:
          type: string
        updatedAt:
          type: string
        metadata:
          type: object
          nullable: true
    UpdateSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateResponse'
    UpdatePageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UpdateResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - created_at
                - updated_at
                - provider
                - host
                - label
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    WebhookSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/WebhookResponse'
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - generic
            - diun
        createdAt:
          type: string
        updatedAt:
          type: string
        token:
          type: string
          description: Only returned during creation
          nullable: true
        ignoreHost:
          type: boolean
    WebhookPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/WebhookResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - label
                - type
                - created_at
                - updated_at
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    EventWindowResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/EventResponse'
            size:
              type: number
            skip:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - name
                - created_at
                - updated_at
            order:
              type: string
              enum:
                - asc
                - desc
            hasNext:
              type: boolean
    EventSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/EventResponse'
    EventResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          enum:
            - update_created
            - update_updated
            - update_updated_state
            - update_updated_version
            - update_deleted
        createdAt:
          type: string
        updatedAt:
          type: string
        payload:
          type: object
          description: |
            Depending on the event name, different payload can be returned
          oneOf:
            - $ref: '#/components/schemas/EventPayloadUpdateCreatedResponse'
            - $ref: '#/components/schemas/EventPayloadUpdateUpdatedResponse'
            - $ref: '#/components/schemas/EventPayloadUpdateDeletedResponse'
    EventPayloadUpdateCreatedResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    EventPayloadUpdateUpdatedResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        versionPrior:
          type: string
        version:
          type: string
        statePrior:
          type: string
          enum:
            - pending
            - approved
            - ignored
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    EventPayloadUpdateDeletedResponse:
      type: object
      properties:
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    ActionResponse:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - shoutrrr
        matchEvent:
          type: string
          nullable: true
        matchHost:
          type: string
          nullable: true
        matchApplication:
          type: string
          nullable: true
        matchProvider:
          type: string
          nullable: true
        payload:
          type: object
        enabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    ActionSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/ActionResponse'
    ActionPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ActionResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - created_at
                - updated_at
                - label
                - type
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    ActionTestResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Blank in case of success
    ActionTestSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/ActionTestResponse'
    ActionInvocationResponse:
      type: object
      properties:
        id:
          type: string
        retryCount:
          type: number
        state:
          type: string
          enum:
            - created
            - running
            - retrying
            - error
            - success
        message:
          type: string
          nullable: true
        actionId:
          type: string
        eventId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    ActionInvocationSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/ActionInvocationResponse'
    ActionInvocationPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ActionInvocationResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - created_at
                - updated_at
                - state
                - retry_count
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    SecretResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    SecretSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/SecretResponse'
    SecretPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/SecretResponse'
    ConstantResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    ConstantSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/ConstantResponse'
    ConstantPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ConstantResponse'
    # requests
    ModifyUpdateStateRequest:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    ModifyWebhookLabelRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    ModifyWebhookIgnoreHostRequest:
      type: object
      required:
        - ignoreHost
      properties:
        ignoreHost:
          type: boolean
    CreateWebhookRequest:
      type: object
      required:
        - label
        - type
      properties:
        label:
          type: string
        type:
          type: string
          enum:
            - generic
            - diun
        ignoreHost:
          type: boolean
    WebhookGenericRequest:
      type: object
      required:
        - application
        - host
        - version
      properties:
        application:
          type: string
        provider:
          type: string
          description: The optional provider attribute. If left blank or not sent during webhook invocation, the issuing webhook's label is used.
          nullable: true
        host:
          type: string
        version:
          type: string
        metadata:
          description: "Any JSON object"
          type: object
          additionalProperties:
            type: object
    WebhookDiunRequest:
      type: object
      required:
        - diun_version
        - hostname
        - status
        - provider
        - image
        - mime_type
        - digest
        - created
        - platform
        - metadata
      properties:
        diun_version:
          type: string
        hostname:
          type: string
        status:
          type: string
        provider:
          type: string
        image:
          type: string
        hub_link:
          type: string
        mime_type:
          type: string
        digest:
          type: string
        created:
          type: string
        platform:
          type: string
        metadata:
          type: object
          properties:
            ctn_command:
              type: string
            ctn_createdat:
              type: string
            ctn_id:
              type: string
            ctn_names:
              type: string
            ctn_size:
              type: string
            ctn_state:
              type: string
            ctn_status:
              type: string
    CreateActionRequest:
      type: object
      required:
        - label
        - type
        - payload
        - enabled
      properties:
        label:
          type: string
        type:
          type: string
          enum:
            - shoutrrr
        matchEvent:
          type: string
        matchHost:
          type: string
        matchApplication:
          type: string
        matchProvider:
          type: string
        enabled:
          type: boolean
        payload:
          type: object
          anyOf:
            - $ref: '#/components/schemas/CreateActionPayloadRequestShoutrrr'
    CreateActionPayloadRequestShoutrrr:
      type: object
      required:
        - urls
        - body
      properties:
        urls:
          type: array
          items:
            type: string
        body:
          type: string
    TestActionRequest:
      type: object
      required:
        - application
        - provider
        - host
        - version
        - state
      properties:
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
    CreateSecretRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    CreateConstantRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    ModifySecretValueRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
    ModifyConstantValueRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
    ModifyActionLabelRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    ModifyActionTypeRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - shoutrrr
    ModifyActionMatchEventRequest:
      type: object
      properties:
        matchEvent:
          type: string
          nullable: true
    ModifyActionMatchHostRequest:
      type: object
      properties:
        matchHost:
          type: string
          nullable: true
    ModifyActionMatchApplicationRequest:
      type: object
      properties:
        matchApplication:
          type: string
          nullable: true
    ModifyActionMatchProviderRequest:
      type: object
      properties:
        matchProvider:
          type: string
          nullable: true
    ModifyActionPayloadRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - shoutrrr
        payload:
          type: object
    ModifyActionEnabledRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
