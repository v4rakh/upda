              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/events/{id}':
    delete:
      tags:
        - events
      security:
        - basicAuth: [ ]
      summary: Deletes a event by ID
      description: 'Deletes a event by ID'
      operationId: deleteEventById
      parameters:
        - name: id
          in: path
          description: the id
          required: true
          schema:
            type: string
      responses:
        '204':
