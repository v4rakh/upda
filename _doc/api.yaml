        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    get:
      tags:
        - auth
      security:
        - basicAuth: [ ]
      summary: Probes login
      description: Probes login
      operationId: probeLogin
      responses:
        '204':
          description: Successful operation
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    # response
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          enum:
            - IllegalArgument
            - Unauthorized
            - Forbidden
            - NotFound
            - Conflict
            - GeneralError
    InfoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            timeZone:
              type: string
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            healthy:
              type: boolean
    UpdateResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
        createdAt:
          type: string
        updatedAt:
          type: string
        metadata:
          type: object
          nullable: true
    UpdateSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateResponse'
    UpdatePageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UpdateResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - created_at
                - updated_at
                - provider
                - host
                - label
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    WebhookSingleResponse:
      type: object
      properties:
        data:
          type: object
          allOf:
            - $ref: '#/components/schemas/WebhookResponse'
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - generic
            - diun
        createdAt:
          type: string
        updatedAt:
          type: string
        token:
          type: string
          description: Only returned during creation
          nullable: true
        ignoreHost:
          type: boolean
    WebhookPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/WebhookResponse'
            page:
              type: number
            pageSize:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - label
                - type
                - created_at
                - updated_at
            order:
              type: string
              enum:
                - asc
                - desc
            totalElements:
              type: number
            totalPages:
              type: number
    EventWindowResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/EventResponse'
            size:
              type: number
            skip:
              type: number
            orderBy:
              type: string
              enum:
                - id
                - name
                - created_at
                - updated_at
            order:
              type: string
              enum:
                - asc
                - desc
            hasNext:
              type: boolean
    EventResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          enum:
            - update_created
            - update_updated
            - update_updated_state_pending
            - update_updated_state_approved
            - update_updated_state_ignored
            - update_deleted
            - webhook_created
            - webhook_updated_label
            - webhook_updated_ignore_host
            - webhook_deleted
        state:
          type: string
          enum:
            - created
        createdAt:
          type: string
        updatedAt:
          type: string
        payload:
          type: object
          description: |
            Depending on the event name, different payload can be returned
          oneOf:
            - $ref: '#/components/schemas/EventPayloadUpdateCreatedResponse'
            - $ref: '#/components/schemas/EventPayloadUpdateUpdatedResponse'
            - $ref: '#/components/schemas/EventPayloadUpdateDeletedResponse'
            - $ref: '#/components/schemas/EventPayloadWebhookCreatedResponse'
            - $ref: '#/components/schemas/EventPayloadWebhookUpdatedResponse'
            - $ref: '#/components/schemas/EventPayloadWebhookDeletedResponse'
    EventPayloadUpdateCreatedResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    EventPayloadUpdateUpdatedResponse:
      type: object
      properties:
        id:
          type: string
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        versionPrior:
          type: string
        version:
          type: string
        statePrior:
          type: string
          enum:
            - pending
            - approved
            - ignored
        state:
          type: string
          enum:
            - pending
            - approved
            - ignored
    EventPayloadUpdateDeletedResponse:
      type: object
      properties:
        application:
          type: string
        provider:
          type: string
        host:
          type: string
        version:
          type: string
    EventPayloadWebhookCreatedResponse:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - generic
            - diun
        ignoreHost:
          type: boolean
    EventPayloadWebhookUpdatedResponse:
