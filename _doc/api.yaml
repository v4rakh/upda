        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - webhooks
      security:
        - basicAuth: [ ]
      summary: Finds webhooks
      description: Finds webhooks
      operationId: findWebhooks
      parameters:
        - name: page
          in: query
          description: the page
          required: false
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          description: the page size
          required: false
          schema:
            type: number
            default: 5
        - name: order
          in: query
          description: the order
          required: false
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
        - name: orderBy
          in: query
          description: the order by
          required: false
          schema:
            type: string
            default: updated_at
            enum:
              - id
              - label
              - created_at
              - updated_at
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
