openapi: 3.0.3
info:
  title: upda
  description: API specification
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 1.0.1
externalDocs:
  description: Find out more about the project
  url: https://git.myservermanager.com/varakh/upda
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: updates
    description: Updates endpoints
  - name: webhooks
    description: Webhooks endpoints
  - name: events
    description: Events endpoints
  - name: application
    description: Application related endpoints
  - name: auth
    description: Application authorization related endpoints
paths:
  '/info':
    get:
      tags:
        - application
      summary: Find application information
      description: Find application information
      operationId: findInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
  '/health':
    get:
      tags:
        - application
      summary: Find application health
      description: Find application health
      operationId: findHealth
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /updates:
    get:
      tags:
        - updates
      security:
        - basicAuth: [ ]
      summary: Finds updates
      description: Finds updates
      operationId: findUpdates
      parameters:
        - name: page
          in: query
          description: the page
          required: false
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          description: the page size
          required: false
          schema:
            type: number
            default: 5
        - name: order
          in: query
          description: the order
          required: false
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
        - name: orderBy
          in: query
          description: the order by
          required: false
          schema:
            type: string
            default: updated_at
            enum:
              - id
              - application
              - provider
              - host
              - created_at
              - updated_at
        - name: state
          in: query
          description: the state (list, added with &state=...&state=...
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - pending
                - ignored
                - approved
        - name: searchTerm
          in: query
          description: the search term
          required: false
          schema:
            type: string
        - name: searchIn
          in: query
          description: the search in
          required: false
          schema:
            type: string
            default: application
            enum:
              - application
              - provider
              - host
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/updates/{id}':
    get:
      tags:
        - updates
      security:
        - basicAuth: [ ]
      summary: Finds update by ID
      description: Finds update by ID
      operationId: findUpdateById
      parameters:
        - name: id
          in: path
          description: the id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSingleResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - updates
      security:
        - basicAuth: [ ]
      summary: Deletes an update by ID
      description: 'Deletes an update by ID'
      operationId: deleteUpdateById
      parameters:
        - name: id
          in: path
          description: the id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/updates/{id}/state':
    patch:
      tags:
        - updates
      security:
        - basicAuth: [ ]
      summary: Modifies update's state by ID
      description: Modifies update's state by ID
      operationId: patchUpdateStateById
      parameters:
        - name: id
