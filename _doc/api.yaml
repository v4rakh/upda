      tags:
        - updates
      security:
        - basicAuth: [ ]
      summary: Finds updates
      description: Finds updates
      operationId: findUpdates
      parameters:
        - name: page
          in: query
          description: the page
          required: false
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          description: the page size
          required: false
          schema:
            type: number
            default: 5
        - name: order
          in: query
