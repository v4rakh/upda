  /events:
    get:
      tags:
        - events
      security:
        - basicAuth: [ ]
      summary: Finds events
      description: Finds events
      operationId: findEvents
      parameters:
        - name: size
          in: query
          description: the size
          required: false
          schema:
            type: number
            default: 10
        - name: skip
          in: query
          description: the skip
          required: false
          schema:
            type: number
            default: 0
        - name: order
          in: query
          description: the order
          required: false
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
        - name: orderBy
          in: query
          description: the order by
          required: false
          schema:
            type: string
            default: created_at
            enum:
              - id
              - name
              - created_at
              - updated_at
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWindowResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
