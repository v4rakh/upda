              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - webhooks
      security:
        - basicAuth: [ ]
      summary: Deletes a webhook by ID
      description: 'Deletes a webhook by ID'
      operationId: deleteWebhookById
      parameters:
