            type: string
            default: updated_at
            enum:
              - id
              - application
              - provider
              - host
              - created_at
              - updated_at
        - name: state
          in: query
          description: the state (list, added with &state=...&state=...
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
