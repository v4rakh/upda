runs:
  using: "composite"
  steps:
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.23'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2