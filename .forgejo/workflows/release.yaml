on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to use"
        required: true
        type: string
jobs:
  release:
    runs-on: docker
    container:
      image: git.myservermanager.com/msm/executor-ubuntu-build-essential:latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.forgejo/actions/prepare
      - uses: ./.forgejo/actions/native-build
      - uses: ./.forgejo/actions/oci-release
        with:
          version: ${{ inputs.version }}
          registryFQDN: git.myservermanager.com
          registryUser: ${{ secrets.FORGEJO_USER }}
          registryPass: ${{ secrets.FORGEJO_TOKEN }}
          dockerHubUser: ${{ secrets.DOCKERHUB_USER }}
          dockerHubPass: ${{ secrets.DOCKERHUB_KEY }}
      - uses: ./.forgejo/actions/release
        with:
          version: ${{ inputs.version }}
          token: ${{ secrets.FORGEJO_TOKEN }}