on:
  push:
    tags:
      - '*'
env:
  VERSION_MAJOR: 6
  VERSION_MINOR: 1
  VERSION_PATCH: 1
  IMAGE_TAG_SERVER: varakh/upda
  IMAGE_TAG_SERVER_PRIVATE: git.myservermanager.com/varakh/upda
  IMAGE_TAG_STANDALONE_WEB_INTERFACE: varakh/upda-standalone-webinterface
  IMAGE_TAG_STANDALONE_WEB_INTERFACE_PRIVATE: git.myservermanager.com/varakh/upda-standalone-webinterface
  FORGEJO_URL: https://git.myservermanager.com
  FORGEJO_FQDN: git.myservermanager.com
  FORGEJO_REPO: varakh/upda
jobs:
  release:
    runs-on: docker
    container:
      image: git.myservermanager.com/msm/executor-ubuntu-build-essential:latest
    steps:
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.23'
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test native build
        run: |
          npm install --global pnpm@^10
          make ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Forgejo
        uses: docker/login-action@v2
        with:
          registry: ${{ env.FORGEJO_FQDN }}
          username: ${{ secrets.FORGEJO_USER }}
          password: ${{ secrets.FORGEJO_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_KEY }}
      - name: "[SERVER] Build and push docker image"
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_TAG_SERVER_PRIVATE }}:${{ env.VERSION_MAJOR }}
            ${{ env.IMAGE_TAG_SERVER_PRIVATE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}
            ${{ env.IMAGE_TAG_SERVER_PRIVATE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}
            ${{ env.IMAGE_TAG_SERVER_PRIVATE }}:latest
            ${{ env.IMAGE_TAG_SERVER }}:${{ env.VERSION_MAJOR }}
            ${{ env.IMAGE_TAG_SERVER }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}
            ${{ env.IMAGE_TAG_SERVER }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}
            ${{ env.IMAGE_TAG_SERVER }}:latest
      - name: "[STANDALONE_WEB_INTERFACE] Build and push docker image"
        uses: docker/build-push-action@v4
        with:
          context: ./server/web/
          push: true
          tags: |
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE_PRIVATE }}:${{ env.VERSION_MAJOR }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE_PRIVATE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE_PRIVATE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE_PRIVATE }}:latest
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE }}:${{ env.VERSION_MAJOR }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE }}:${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE }}:latest
      - name: Upload artifacts
        uses: actions/forgejo-release@v1
        with:
          url: ${{ env.FORGEJO_URL }}
          repo: ${{ env.FORGEJO_REPO }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          direction: upload
          tag: ${{ github.ref_name }}
          release-dir: bin
          release-notes: "Release of version '${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}'. For a complete changelog, look into ${{ env.FORGEJO_URL }}/${{ env.FORGEJO_REPO }}/src/tag/${{ github.ref_name }}/CHANGELOG.md"
