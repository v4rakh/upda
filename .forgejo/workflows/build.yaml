on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - master
env:
  IMAGE_TAG_SERVER: varakh/upda
  IMAGE_TAG_STANDALONE_WEB_INTERFACE: varakh/upda-standalone-webinterface
jobs:
  build:
    runs-on: docker
    container:
      image: git.myservermanager.com/msm/executor-ubuntu-build-essential:latest
    steps:
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.23'
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test native build
        run: |
          npm install --global pnpm@^10
          make ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: "[SERVER] Test docker image build"
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_TAG_SERVER }}:${{ github.sha }}
      - name: "[STANDALONE_WEB_INTERFACE] Test docker image build"
        uses: docker/build-push-action@v4
        with:
          context: ./server/web/
          push: false
          tags: |
            ${{ env.IMAGE_TAG_STANDALONE_WEB_INTERFACE }}:${{ github.sha }}
